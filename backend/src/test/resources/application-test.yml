spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;database=teamX_test;encrypt=true;trustServerCertificate=true}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:create-drop}
    show-sql: false
  flyway:
    enabled: false

jwt:
  secret: dev_secret_key_for_jwt_token_generation_which_is_at_least_256_bits_long_teamx
  expiration: 900000
  refresh-expiration: 604800000
