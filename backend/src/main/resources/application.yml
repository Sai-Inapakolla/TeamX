spring:
  application:
    name: saas-platform

  # --- Database Connection (Azure SQL / MySQL / H2 Fallback) ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/saas_platform;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.SQLServerDialect}

  sql:
    init:
      mode: never

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

cloudinary:
  url: ${CLOUDINARY_URL:}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-local-development-only-change-in-production-min-32-chars!!}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:inapakolla.sai1@gmail.com}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

logging:
  level:
    com.saas.platform: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:WARN}
